name: adgen_pharmacy_erp
description: AdGen Pharmacy ERP — Full-featured pharmacy management system
publish_to: 'none'
version: 1.0.2+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.1.4


  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.12.0

  # Sharing / WhatsApp
  share_plus: ^10.1.4

  # Image Picker (prescription upload)
  image_picker: ^1.1.2

  # AI
  google_generative_ai: ^0.4.3

  # UI Utilities
  intl: ^0.19.0
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.6
  uuid: ^4.4.0
  collection: ^1.18.0
  equatable: ^2.0.5

  # Google Fonts (loads Inter from network — no local font files needed)
  google_fonts: ^6.2.1
  file_picker: ^8.1.4
  csv: ^8.0.0
  package_info_plus: ^9.0.1
  dio: ^5.10.0
  open_file: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
